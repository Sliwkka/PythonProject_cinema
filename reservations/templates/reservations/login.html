{% extends 'reservations/base.html' %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h1 class="mb-4">Logowanie</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-danger w-100">Zaloguj się</button>
            </form>
            <br>
            <a href="{% url 'register' %}">Nie masz konta? Zarejestruj się</a>
        </div>
    </div>
{% endblock %}
