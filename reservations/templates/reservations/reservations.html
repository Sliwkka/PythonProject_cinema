{% extends 'reservations/base.html' %}

{% block content %}
    <div class="text-center mt-5">
        <h1 class="text-success">Rezerwacja potwierdzona! ✅</h1>
        <div class="card w-50 mx-auto mt-4">
            <div class="card-body">
                <h5 class="card-title">{{ screening.movie.title }}</h5>
                <p class="card-text"><strong>📅 Data:</strong> {{ screening.date }}</p>
                <p class="card-text"><strong>🕐 Godzina:</strong> {{ screening.time }}</p>
                <p class="card-text"><strong>🎭 Sala:</strong> {{ screening.hall }}</p>
            </div>
        </div>
        <a href="{% url 'movie_list' %}" class="btn btn-danger mt-4">Wróć do filmów</a>
    </div>
{% endblock %}
